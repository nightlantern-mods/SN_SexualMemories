# SN Sexual Memories - settings schema. The filename names the config (Plugin_SNSexualMemories).
# The variants give the scene memories, the diary entries and the relationship map their own
# models: players set them in SkyrimNet's dashboard, AI > Models.
plugin:
  name: SNSexualMemories
  version: "0.4.5"
  description: "SN Sexual Memories: scene memories, diary entries after scenes, lines during scenes, complaints, your character speaking up, followers talking behind your back, quest diary entries, and the relationship map."

variants:
  - name: sn_sexual_memories_memory
    description: "Writes the memories of a scene: one request per person who took part, and one for a witness. Answers in JSON."
  - name: sn_sexual_memories_diary
    description: "Writes the diary entries: after a scene, one per person who took part (MCM diary option), and when a quest's journal changes, one for the player and each follower near them (MCM quest diary option). Answers in JSON."
  - name: sn_sexual_memories_relmap
    description: "Draws the relationship map: one request per person around the centre (what happened between them and how they feel, from their memories and events), then one for the summary. Answers in JSON; a model that follows JSON instructions well is best."

schema:
  fields:
    - name: "Model Name"
      path: "llm.model_name"
      type: "string"
      description: "Model for the relationship map. Leave empty to inherit SkyrimNet's base model."
      defaultValue: ""
      category: "LLM Overrides"

    - name: "Max Tokens"
      path: "llm.max_tokens"
      type: "int"
      description: "Longest answer the model may give for one person of the map. Too low and the description is cut off. Set 0 to inherit SkyrimNet's base value."
      defaultValue: 2048
      min: 0
      max: 16384
      category: "LLM Overrides"
